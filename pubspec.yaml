name: maatricare
description: "MaatriCare - Your intelligent maternal healthcare companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  
  # Navigation
  go_router: ^15.1.2
  
  # Network
  dio: ^5.8.0+1
  
  # Local Storage
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  smooth_page_indicator: ^1.2.0+3
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  syncfusion_flutter_pdfviewer: ^33.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
